<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <script src="/static/theme_boot.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Sudoku Game</h1>
      <button type="button" id="theme-toggle" aria-pressed="false">Dark mode</button>
    </header>
    <div class="game-info">
      <div class="player-field">
        <label for="player-name">Player name</label>
        <input type="text" id="player-name" name="player-name" maxlength="30"
               autocomplete="nickname" aria-describedby="player-name-hint">
        <p id="player-name-hint" class="field-hint">Use 1–30 characters. Left empty, scores are saved as Anonymous.</p>
      </div>
      <p class="game-stat">Time: <time id="timer" role="timer" datetime="PT0S">00:00</time></p>
      <p class="game-stat">Hints used: <span id="hints-used">0</span></p>
    </div>
    <div id="sudoku-board" role="group" aria-label="Sudoku board"></div>
    <div class="controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty" name="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button type="button" id="new-game">New Game</button>
      <button type="button" id="check-solution">Check Solution</button>
      <button type="button" id="hint">Hint</button>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <section class="scoreboard" aria-labelledby="scoreboard-heading">
      <h2 id="scoreboard-heading">Top 10</h2>
      <div class="table-scroll" role="region" aria-labelledby="scoreboard-caption" tabindex="0">
        <table id="scoreboard">
          <caption id="scoreboard-caption">Fastest completed games saved in this browser</caption>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Player</th>
              <th scope="col">Time</th>
              <th scope="col">Difficulty</th>
              <th scope="col">Hints</th>
            </tr>
          </thead>
          <tbody id="scoreboard-body">
            <tr><td colspan="5">No scores yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
